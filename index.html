<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BATTLE OF BELIEFS</title>
<meta name="description" content="Theological boxing simulator — pit 13 belief systems against each other in a WebGL ring." />

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://battle-of-beliefs.vercel.app/" />
<meta property="og:title" content="BATTLE OF BELIEFS — Theological Throwdown" />
<meta property="og:description" content="Pit 13 belief systems against each other in a WebGL boxing ring." />
<meta property="og:image" content="https://battle-of-beliefs.vercel.app/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="BATTLE OF BELIEFS" />
<meta name="twitter:description" content="Theological boxing simulator. Pick two beliefs. Watch them throw down." />
<meta name="twitter:image" content="https://battle-of-beliefs.vercel.app/og.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #f7e9c9;
    --paper: #fff7df;
    --crimson: #c8102e;
    --gold: #d6a737;
    --shadow: rgba(0,0,0,0.55);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: var(--ink);
    font-family: 'Bebas Neue', system-ui, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  canvas#stage {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    pointer-events: none; /* never block UI; 3D scene is presentational */
    z-index: 1;
  }
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: calc(22px + var(--safe-top)) calc(28px + var(--safe-right)) 14px calc(28px + var(--safe-left));
    z-index: 30;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    pointer-events: auto;
  }
  #title {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(34px, 5.2vw, 70px);
    letter-spacing: 0.06em;
    color: var(--gold);
    text-shadow:
      2px 2px 0 #6b0e1c,
      4px 4px 0 #2a0509,
      0 0 30px rgba(214,167,55,0.4);
    line-height: 1;
    text-align: center;
  }
  #title small {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.22em;
    letter-spacing: 0.5em;
    color: #fff;
    margin-top: 4px;
    text-shadow: 1px 1px 0 #000;
  }
  #matchmake {
    margin: 16px auto 0;
    max-width: 1100px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    pointer-events: auto;
  }
  .mm-label {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(18px, 1.8vw, 26px);
    letter-spacing: 0.12em;
    color: var(--ink);
    padding: 6px 12px;
    background: var(--crimson);
    border: 2px solid #ffd76b;
    box-shadow: 3px 3px 0 #000;
  }
  .dropdown {
    position: relative;
    display: inline-block;
    min-width: 240px;
    z-index: 32;
  }
  .dropdown-trigger {
    width: 100%;
    background: var(--paper);
    color: #1a1a1a;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(18px, 1.7vw, 24px);
    letter-spacing: 0.08em;
    padding: 10px 38px 10px 16px;
    border: 3px solid #000;
    box-shadow: 4px 4px 0 #000, inset 0 -3px 0 #d6c290;
    cursor: pointer;
    text-align: left;
    position: relative;
    transition: filter 0.15s;
  }
  .dropdown-trigger:hover { filter: brightness(1.05); }
  .dropdown-trigger:focus { outline: 3px solid var(--gold); outline-offset: 2px; }
  .dropdown-arrow {
    position: absolute;
    right: 16px;
    top: 50%;
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 8px solid #000;
    transform: translateY(-50%);
    pointer-events: none;
    transition: transform 0.15s;
  }
  .dropdown.open .dropdown-arrow {
    transform: translateY(-50%) rotate(180deg);
  }
  .dropdown-list {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: var(--paper);
    border: 3px solid #000;
    box-shadow: 6px 6px 0 #000;
    list-style: none;
    margin: 0;
    padding: 4px 0;
    max-height: 60vh;
    overflow-y: auto;
    display: none;
    z-index: 100;
  }
  .dropdown.open .dropdown-list { display: block; }
  .dropdown-list li {
    padding: 10px 16px;
    cursor: pointer;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(16px, 1.4vw, 22px);
    letter-spacing: 0.08em;
    color: #1a1a1a;
    transition: background 0.08s, color 0.08s;
  }
  .dropdown-list li:hover {
    background: var(--gold);
    color: #1a0a02;
  }
  .dropdown-list li.selected {
    background: #1a1a1a;
    color: var(--gold);
    font-weight: bold;
  }
  .dropdown-list li.selected::before {
    content: '✓ ';
  }
  .vs-pill {
    font-family: 'Bungee', sans-serif;
    color: #fff;
    background: #111;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 18px;
    letter-spacing: 0.18em;
    border: 2px solid var(--gold);
  }
  #ringbell {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(20px, 2vw, 28px);
    letter-spacing: 0.14em;
    background: var(--gold);
    color: #1a0a02;
    padding: 10px 24px 10px 18px;
    border: 3px solid #000;
    box-shadow: 5px 5px 0 #000;
    cursor: pointer;
    transition: transform 0.06s, box-shadow 0.06s, filter 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  #ringbell:hover { filter: brightness(1.08); }
  #ringbell:hover .bell-svg { animation: shake 0.5s ease-in-out; transform-origin: 50% 6%; }
  #ringbell:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #000; }
  #ringbell:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: 5px 5px 0 #000; }
  #ringbell .bell-svg {
    width: clamp(28px, 2.6vw, 38px);
    height: clamp(28px, 2.6vw, 38px);
    flex: 0 0 auto;
    filter: drop-shadow(1px 1px 0 #5a3a0a);
  }
  @keyframes shake {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-22deg); }
    40% { transform: rotate(18deg); }
    60% { transform: rotate(-14deg); }
    80% { transform: rotate(10deg); }
  }

  #round-info {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Bungee', sans-serif;
    font-size: clamp(60px, 14vw, 220px);
    color: #fff;
    text-shadow: 4px 4px 0 #c8102e, 8px 8px 0 #000;
    pointer-events: none;
    opacity: 0;
    z-index: 30;
    letter-spacing: 0.04em;
  }
  #round-info.show {
    animation: pop 1.2s ease-out forwards;
  }
  @keyframes pop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }

  #timer {
    position: fixed;
    top: calc(18px + var(--safe-top));
    right: calc(22px + var(--safe-right));
    font-family: 'Bungee', sans-serif;
    font-size: 42px;
    color: var(--gold);
    background: #111;
    padding: 4px 18px;
    border: 3px solid var(--gold);
    box-shadow: 3px 3px 0 #000;
    z-index: 25;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #timer.show { opacity: 1; }

  #fighter-tags {
    position: fixed;
    bottom: calc(24px + var(--safe-bottom));
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 calc(36px + var(--safe-right)) 0 calc(36px + var(--safe-left));
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #fighter-tags.show { opacity: 1; }
  .fighter-tag {
    background: #111;
    border: 3px solid var(--gold);
    padding: 10px 18px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(18px, 2vw, 28px);
    letter-spacing: 0.1em;
    color: var(--ink);
    box-shadow: 4px 4px 0 #000;
    max-width: 38vw;
  }
  .fighter-tag.left { border-left: 12px solid #2b6cb0; }
  .fighter-tag.right { border-right: 12px solid #c8102e; }
  .fighter-tag .corner { display: block; font-size: 0.55em; color: var(--gold); letter-spacing: 0.3em; }

  #notecard-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 40;
    opacity: 0;
    transition: opacity 0.5s;
  }
  #notecard-wrap.show { opacity: 1; }
  #notecard {
    width: min(720px, 86vw);
    background: var(--paper);
    color: #1a1a1a;
    padding: 36px 44px 44px;
    font-family: 'Special Elite', 'Courier New', monospace;
    box-shadow: 12px 14px 0 rgba(0,0,0,0.7);
    border: 3px solid #1a1a1a;
    transform: translateY(180px) rotate(-1.4deg);
    transition: transform 0.6s cubic-bezier(.22,1.3,.36,1);
    position: relative;
  }
  #notecard-wrap.show #notecard {
    transform: translateY(0) rotate(-1.4deg);
  }
  #notecard::before {
    content: '';
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 18px;
    background: var(--crimson);
    box-shadow: 0 2px 0 rgba(0,0,0,0.4);
    border: 2px solid #1a1a1a;
  }
  #notecard h2 {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(20px, 2.2vw, 28px);
    letter-spacing: 0.08em;
    color: var(--crimson);
    margin-bottom: 6px;
    padding-right: 40px;
  }
  #nc-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    padding: 0;
    background: var(--crimson);
    color: #fff;
    border: 2px solid #1a1a1a;
    box-shadow: 3px 3px 0 #000;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.15s, transform 0.05s, box-shadow 0.05s;
    z-index: 2;
  }
  #nc-close:hover { filter: brightness(1.15); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #000; }
  #nc-close:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  #nc-close svg { display: block; }
  #notecard .winner-line {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(24px, 3vw, 40px);
    color: #1a1a1a;
    margin-bottom: 18px;
    line-height: 1.05;
  }
  #notecard .move-line {
    font-size: clamp(14px, 1.4vw, 18px);
    color: #8a3a13;
    margin-bottom: 14px;
    font-weight: 700;
  }
  #notecard .quip {
    font-size: clamp(16px, 1.6vw, 22px);
    line-height: 1.45;
    border-top: 2px dashed #888;
    padding-top: 14px;
    color: #1a1a1a;
  }
  #notecard .fineprint {
    margin-top: 16px;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #777;
    text-transform: uppercase;
  }

  /* Social-share row inside the notecard — icon-only square buttons */
  #share-row {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    justify-content: center;
  }
  .share-btn {
    width: 44px;
    height: 44px;
    padding: 0;
    border: 2px solid #1a1a1a;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: filter 0.15s, transform 0.05s, box-shadow 0.05s;
    box-shadow: 3px 3px 0 #000;
  }
  .share-btn:hover { filter: brightness(1.15); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #000; }
  .share-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  .share-btn svg { display: block; }
  .share-x  { background: #111; color: #fff; }
  .share-fb { background: #1877f2; color: #fff; }
  .share-ig { background: linear-gradient(135deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888); color: #fff; }
  .share-save { background: var(--gold); color: #1a0a02; }
  /* The notecard wrapper has pointer-events:none so clicks pass through to
     the canvas — and crucially also to the dropdown list above it. We only
     enable pointer-events on the notecard and its children when .show is
     applied, otherwise the hidden card (sitting at z-index 40) silently
     blocks clicks for any UI element visually below it (the dropdown list
     items in the lower half of the screen, etc.). */
  #notecard-wrap.show #notecard,
  #notecard-wrap.show #share-row,
  #notecard-wrap.show .share-btn,
  #notecard-wrap.show #nc-close {
    pointer-events: auto;
  }

  /* During a live bout, dim the top HUD so it doesn't compete with the
     fighter banners. Restored when the bout ends (or before it starts). */
  body.bout-active #hud {
    opacity: 0.12;
    pointer-events: none;
    transition: opacity 0.35s ease-out;
  }
  body:not(.bout-active) #hud {
    opacity: 1;
    transition: opacity 0.35s ease-in;
  }

  /* Mobile: single-column buttons, stacked controls, tighter layout */
  @media (max-width: 760px) {
    #hud { padding: calc(10px + var(--safe-top)) 10px 6px; }
    #title { font-size: clamp(24px, 6.5vw, 38px); line-height: 0.95; }
    #title small { font-size: 0.3em; letter-spacing: 0.28em; margin-top: 2px; }
    #matchmake {
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .mm-label { font-size: 12px; padding: 3px 8px; letter-spacing: 0.08em; }
    .vs-pill { font-size: 11px; padding: 3px 10px; }
    .dropdown { width: 100%; min-width: 0; max-width: 92vw; }
    .dropdown-trigger { font-size: 20px; padding: 11px 38px 11px 14px; min-height: 44px; }
    .dropdown-list { max-height: 48vh; }
    .dropdown-list li { padding: 13px 14px; font-size: 19px; }
    #ringbell { width: 100%; max-width: 92vw; justify-content: center; padding: 12px 16px; font-size: 20px; min-height: 48px; }
    #ringbell .bell-svg { width: 28px; height: 28px; }
    #timer { font-size: 28px; padding: 2px 10px; }
    #fighter-tags { padding: 0 10px; }
    .fighter-tag { font-size: 12px; padding: 5px 8px; max-width: 44vw; border-width: 2px; }
    .fighter-tag.left  { border-left-width: 8px; }
    .fighter-tag.right { border-right-width: 8px; }
    .fighter-tag .corner { font-size: 0.5em; letter-spacing: 0.18em; }
    #notecard { padding: 22px 20px 24px; width: 92vw; max-height: 84vh; overflow-y: auto; }
    #notecard h2 { font-size: 16px; padding-right: 44px; }
    #notecard .winner-line { font-size: clamp(20px, 5.5vw, 28px); margin-bottom: 12px; }
    #notecard .move-line { font-size: 13px; margin-bottom: 10px; }
    #notecard .quip { font-size: 15px; line-height: 1.4; padding-top: 10px; }
    #notecard .fineprint { font-size: 9px; margin-top: 12px; }
    #nc-close { top: 8px; right: 8px; width: 32px; height: 32px; }
    #nc-close svg { width: 16px; height: 16px; }
    #share-row { gap: 12px; margin-top: 16px; }
    .share-btn { width: 48px; height: 48px; }
    .share-btn svg { width: 24px; height: 24px; }
    .credit { display: none; }
    #replay { font-size: 14px; padding: 8px 16px; }
    #round-info { font-size: clamp(70px, 22vw, 140px); }
  }
  @media (max-width: 380px) {
    #share-row { gap: 10px; }
    .share-btn { width: 42px; height: 42px; }
    .share-btn svg { width: 20px; height: 20px; }
  }
  /* Tablet portrait tweaks */
  @media (max-width: 1024px) and (orientation: portrait) {
    #notecard-wrap { padding: 0 8px; }
  }
  /* Avoid pinch-zoom while interacting with the canvas on touch */
  canvas#stage { touch-action: none; }
  #replay {
    position: fixed;
    bottom: calc(38px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
    font-family: 'Bungee', sans-serif;
    background: var(--gold);
    color: #1a0a02;
    padding: 10px 22px;
    border: 3px solid #000;
    box-shadow: 4px 4px 0 #000;
    cursor: pointer;
    letter-spacing: 0.14em;
  }
  #replay.show { opacity: 1; pointer-events: auto; }

  .credit {
    position: fixed;
    bottom: 8px;
    right: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #555;
    z-index: 60;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud">
  <div id="title">BATTLE OF BELIEFS<small>· THE THEOLOGICAL THROWDOWN ·</small></div>
  <div id="matchmake">
    <span class="mm-label">MATCH-MAKE</span>
    <div class="dropdown" id="fighter1-dropdown">
      <button type="button" class="dropdown-trigger">
        <span class="dropdown-value">Catholicism</span>
        <span class="dropdown-arrow"></span>
      </button>
      <ul class="dropdown-list" role="listbox"></ul>
    </div>
    <span class="vs-pill">VS</span>
    <div class="dropdown" id="fighter2-dropdown">
      <button type="button" class="dropdown-trigger">
        <span class="dropdown-value">Science</span>
        <span class="dropdown-arrow"></span>
      </button>
      <ul class="dropdown-list" role="listbox"></ul>
    </div>
    <button id="ringbell">
      <svg class="bell-svg" viewBox="0 0 44 48" aria-hidden="true">
        <defs>
          <linearGradient id="brassGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff5c8"/>
            <stop offset="0.28" stop-color="#f0c958"/>
            <stop offset="0.62" stop-color="#b8861a"/>
            <stop offset="1" stop-color="#6b4a10"/>
          </linearGradient>
          <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c8932a"/>
            <stop offset="1" stop-color="#7a5210"/>
          </linearGradient>
        </defs>
        <!-- Crown loop -->
        <path d="M20 5 Q20 0 22 0 Q24 0 24 5" stroke="#3a2410" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- Yoke / cap -->
        <ellipse cx="22" cy="7" rx="4.5" ry="1.6" fill="#7a5210" stroke="#3a2410" stroke-width="1"/>
        <!-- Bell body -->
        <path d="M8 34 C6 26 9 11 22 11 C35 11 38 26 36 34 Z" fill="url(#brassGrad)" stroke="#3a2410" stroke-width="1.6"/>
        <!-- Shine highlight -->
        <path d="M13 18 Q12 26 14 32" stroke="#fff8d8" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round"/>
        <!-- Mouth rim -->
        <ellipse cx="22" cy="35" rx="14" ry="3" fill="url(#rimGrad)" stroke="#3a2410" stroke-width="1.5"/>
        <!-- Clapper hanging out the bottom -->
        <line x1="22" y1="36" x2="22" y2="42" stroke="#3a2410" stroke-width="1.4"/>
        <circle cx="22" cy="44" r="3.2" fill="#2a1a08" stroke="#3a2410" stroke-width="1"/>
      </svg>
      <span>RING THE BELL</span>
    </button>
  </div>
</div>

<div id="timer">30</div>
<div id="round-info"></div>

<div id="fighter-tags">
  <div class="fighter-tag left"><span class="corner">BLUE CORNER</span><span id="tag1">—</span></div>
  <div class="fighter-tag right"><span class="corner">RED CORNER</span><span id="tag2">—</span></div>
</div>

<div id="notecard-wrap">
  <div id="notecard">
    <button id="nc-close" type="button" aria-label="Close ruling">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6L17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6 6.4 5Z"/>
      </svg>
    </button>
    <h2>OFFICIAL RULING</h2>
    <div class="winner-line" id="nc-winner"></div>
    <div class="move-line" id="nc-move"></div>
    <div class="quip" id="nc-quip"></div>
    <div class="fineprint">SIGNED, THE RING GIRL · BATTLE OF BELIEFS COMMISSION</div>

/* ----- Audience ----- */
function buildAudience() {
  const audience = new THREE.Group();
  // Lighter geometry + fewer rings on mobile keeps the frame rate up
  const headGeo = new THREE.SphereGeometry(0.22, IS_LOW_END ? 6 : 8, IS_LOW_END ? 5 : 6);
  const palette = [0xa05a3a, 0x8b6e4e, 0xd9b58a, 0x6a4a35, 0xf2cfa6, 0x4a3525];
  const ringCount = IS_LOW_END ? 3 : 5;
  // ring of seats
  for (let ring = 0; ring < ringCount; ring++) {
    const radius = 8 + ring * 1.4;
    const count = IS_LOW_END ? (16 + ring * 6) : (24 + ring * 8);
    const y = -0.4 + ring * 0.35;
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2 + ring * 0.13;
      const x = Math.cos(a) * radius;
      const z = Math.sin(a) * radius;
      const head = new THREE.Mesh(
        headGeo,
        new THREE.MeshStandardMaterial({
          color: palette[Math.floor(Math.random() * palette.length)],
          roughness: 0.9,
        })
      );
      head.position.set(x, y, z);
      head.userData.basePhase = Math.random() * Math.PI * 2;
      head.userData.baseY = y;
      audience.add(head);
    }
  }
  scene.add(audience);
  return audience;
}
const audience = buildAudience();

function box(w, h, d, color, opts = {}) {
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.7, metalness: opts.metal ?? 0.05,
    transparent: opts.transparent || false, opacity: opts.opacity ?? 1,
  });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true;
  return m;
}
function sphere(r, color, opts = {}) {
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.7, metalness: opts.metal ?? 0.05,
  });
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
  m.castShadow = true;
  return m;
}
function cyl(rt, rb, h, color, opts = {}) {
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: opts.rough ?? 0.7, metalness: opts.metal ?? 0.05,
  });
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 16), mat);
  m.castShadow = true;
  return m;
}

// Religious symbol floating behind/above each fighter — clearest ID badge
function buildSymbolAura(belief, side) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 256, 256);
  // Glowy circle backdrop
  const grd = ctx.createRadialGradient(128, 128, 30, 128, 128, 128);
  grd.addColorStop(0, 'rgba(255,232,160,0.7)');
  grd.addColorStop(1, 'rgba(255,232,160,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(128, 128, 128, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#d6a737';
  ctx.lineWidth = 8;
  ctx.fillStyle = '#fff7df';
  ctx.font = 'bold 180px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Per-belief glyph
  const glyphs = {
    'Catholicism':       '✝',
    'Protestantism':     '📖',
    'Orthodox Judaism':  '✡',
    'Islam':             '☪',
    'Jainism':           '🕉',
    'Hinduism':          'ॐ',
    'Taoism':            '☯',
    'Mormonism':         '🅼',
    'Scientology':       '⚔',
    'UFO-ology':         '🛸',
    'Science':           '⚛',
    'Atheism':           'Ⓐ',
    'Techno-Utopiaism':  '⚙',
  };
  ctx.fillText(glyphs[belief] || '?', 128, 138);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: true, opacity: 0.75 });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.4, 1.4, 1);
  return sprite;
}

function buildFighter(belief, side /* -1 left, +1 right */) {
  const def = FIGHTERS[belief];
  const group = new THREE.Group();

  // Hip pivot (root)
  const hips = box(0.5, 0.14, 0.32, def.shorts);
  hips.position.y = 1.1;
  group.add(hips);

  // Trunks (waist line)
  const waist = box(0.56, 0.18, 0.36, def.shorts);
  waist.position.y = 0.95;
  group.add(waist);

  // Legs
  function makeLeg(xOffset) {
    const leg = new THREE.Group();
    const thigh = box(0.18, 0.45, 0.18, def.shorts);
    thigh.position.y = -0.22;
    leg.add(thigh);
    const knee = sphere(0.1, def.skin);
    knee.position.y = -0.45;
    leg.add(knee);
    const shin = box(0.16, 0.45, 0.16, def.skin);
    shin.position.y = -0.7;
    leg.add(shin);
    const boot = box(0.22, 0.16, 0.34, 0x111111, { rough: 0.6 });
    boot.position.set(0, -0.96, 0.04);
    leg.add(boot);
    leg.position.set(xOffset, 0.85, 0);
    group.add(leg);
    return leg;
  }
  const legL = makeLeg(-0.13);
  const legR = makeLeg(0.13);

  // Torso
  const torso = box(0.62, 0.7, 0.4, def.robe);
  torso.position.y = 1.5;
  group.add(torso);

  // Trim line at top of trunks
  const trimLine = box(0.66, 0.04, 0.42, def.accent, { metal: 0.3 });
  trimLine.position.y = 1.17;
  group.add(trimLine);

  // Emblem on chest
  const emblem = buildEmblem(def.emblem, def.accent);
  emblem.position.y = 1.5;
  group.add(emblem);

  // Layered, belief-specific outfit (capes, sashes, ties, tags, extra arms…)
  const outfit = buildOutfitLayer(belief, def);
  group.add(outfit);

  // Floating religious symbol behind the fighter, gently bobbing as an aura
  const aura = buildSymbolAura(belief, side);
  aura.position.set(0, 3.0, -1.5);
  group.add(aura);

  // Neck
  const neck = cyl(0.09, 0.1, 0.14, def.skin);
  neck.position.y = 1.92;
  group.add(neck);

  // Head
  const headGroup = new THREE.Group();
  headGroup.position.y = 2.15;
  group.add(headGroup);

  const head = box(0.44, 0.46, 0.4, def.skin);
  headGroup.add(head);

  // Eyes
  const eyeL = sphere(0.05, 0xffffff);
  eyeL.position.set(-0.1, 0.05, 0.21);
  headGroup.add(eyeL);
  const eyeR = sphere(0.05, 0xffffff);
  eyeR.position.set(0.1, 0.05, 0.21);
  headGroup.add(eyeR);
  const pupilL = sphere(0.025, 0x111111);
  pupilL.position.set(-0.1, 0.05, 0.245);
  headGroup.add(pupilL);
  const pupilR = sphere(0.025, 0x111111);
  pupilR.position.set(0.1, 0.05, 0.245);
  headGroup.add(pupilR);

  // Mouth
  const mouth = box(0.18, 0.025, 0.02, 0x4a2418);
  mouth.position.set(0, -0.13, 0.22);
  headGroup.add(mouth);

  // Facial features
  const facial = buildFacial(def.facial);
  headGroup.add(facial);

  // Head prop
  const headProp = buildHeadProp(def.head, def.robe, def.accent);
  headProp.position.y = 0.3;
  headGroup.add(headProp);

  // Arms — these are pivoted at the shoulder for animation
  function makeArm(xOffset) {
    const arm = new THREE.Group();
    arm.position.set(xOffset, 1.78, 0);

    const upper = box(0.18, 0.42, 0.18, def.robe);
    upper.position.y = -0.21;
    arm.add(upper);

    const elbow = sphere(0.11, def.skin);
    elbow.position.y = -0.42;
    arm.add(elbow);

    const forearm = box(0.16, 0.38, 0.16, def.skin);
    forearm.position.y = -0.62;
    arm.add(forearm);

    // Bigger gloves so the contact moment actually reads as a punch landing
    const glove = sphere(0.24, 0xc8102e, { rough: 0.55 });
    glove.position.y = -0.92;
    arm.add(glove);
    // Wrist tape suggestion
    const wrap = cyl(0.1, 0.12, 0.07, 0xfafafa, { rough: 0.9 });
    wrap.position.y = -0.78;
    arm.add(wrap);

    return arm;
  }
  const armL = makeArm(-0.4);
  const armR = makeArm(0.4);
  group.add(armL);
  group.add(armR);

  // Floating name banner above head (so fighters are recognizable).
  // The banner can sit either above the fighter's head (during the bout)
  // or out to the side (so it doesn't overlap with the top HUD pre-bout).
  const cornerColor = side < 0 ? '#2b6cb0' : '#c8102e';
  const label = buildNameLabel(belief, cornerColor);
  // Side position is in fighter-local coords. local -z (behind the fighter)
  // maps to the world side the fighter is on, so this pushes the banner
  // off to the left for the left fighter and off to the right for the right.
  label.position.set(0, 2.4, -3.2);
  group.add(label);

  // Place + face center — fighters are now closer so punches actually connect
  group.position.set(side * 0.75, 0, 0);
  group.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;

  return {
    group, hips, torso, headGroup, armL, armR, legL, legR, label,
    side, belief,
    // Animation state
    state: 'idle',
    stateTimer: 0,
    hp: 100,
    bobPhase: Math.random() * Math.PI * 2,
    facing: side > 0 ? -Math.PI / 2 : Math.PI / 2,
    // Label mode: 'side' (pre-bout, off to the side) or 'top' (during/after bout)
    labelMode: 'side',
    labelLerp: 0,
  };
}

function buildNameLabel(text, accentCss) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 1024, 256);
  // Black banner with thick accent border
  ctx.fillStyle = 'rgba(15,15,15,0.92)';
  ctx.fillRect(20, 60, 984, 150);
  ctx.strokeStyle = accentCss;
  ctx.lineWidth = 12;
  ctx.strokeRect(20, 60, 984, 150);
  // Gold inner outline
  ctx.strokeStyle = '#d6a737';
  ctx.lineWidth = 4;
  ctx.strokeRect(36, 76, 952, 118);
  // Text
  ctx.fillStyle = '#fff7df';
  ctx.font = 'bold 96px Bebas Neue, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text.toUpperCase(), 512, 138);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  // Bigger banners on mobile portrait so the names stay readable when the
  // camera is pulled back and the fighters look smaller in the frame.
  const isPortrait = window.innerWidth < window.innerHeight;
  const isNarrow = window.innerWidth < 700;
  const w = isPortrait ? (isNarrow ? 5.6 : 4.8) : 4.2;
  sprite.scale.set(w, w * 0.25, 1);
  sprite.renderOrder = 999;
  return sprite;
}

// Impact starburst sprite — "POW!" / "WHAM!" / "KO!"
function buildImpactSprite(text, color) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 512, 512);
  // Starburst
  ctx.fillStyle = '#ffeb3b';
  ctx.strokeStyle = color || '#c8102e';
  ctx.lineWidth = 14;
  ctx.beginPath();
  const points = 14;
  for (let i = 0; i < points * 2; i++) {
    const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
    const r = i % 2 === 0 ? 240 : 130;
    const x = 256 + Math.cos(a) * r;
    const y = 256 + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  // Inner star
  ctx.fillStyle = '#fffacd';
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = (i / (points * 2)) * Math.PI * 2 + Math.PI / 14;
    const r = i % 2 === 0 ? 150 : 80;
    const x = 256 + Math.cos(a) * r;
    const y = 256 + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  // Text
  ctx.fillStyle = color || '#c8102e';
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 8;
  ctx.font = 'bold 160px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeText(text, 256, 270);
  ctx.fillText(text, 256, 270);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(1.6, 1.6, 1);
  sprite.renderOrder = 1000;
  return sprite;
}

  impactPool.push(sprite);
}

/* ============================================================
   ANIMATION / BOUT LOGIC
   ============================================================ */
const clock = new THREE.Clock();
let fighters = []; // [fighter1, fighter2]
let bout = null;   // { startTime, endTime, winner, loser, move, quip, events: [...] }

// Animation state per fighter:
//   'idle' (bouncing), 'jab' (quick left punch), 'cross' (right punch),
//   'hook' (looping side punch), 'block' (arms up), 'stagger' (rocked back),
//   'ko' (lying on the mat), 'victory' (arms up celebrating)

function setFighterState(f, state, opts = {}) {
  f.state = state;
  f.stateTimer = 0;
  f.stateOpts = opts;
}

function updateFighter(f, t, dt) {
  const g = f.group;
  const phase = t * 4 + f.bobPhase;

  // Default arm rest positions (relative to shoulder)
  const restL = { rx: 1.4, rz: 0.3 };
  const restR = { rx: 1.4, rz: -0.3 };

  let targetArmL = { ...restL };
  let targetArmR = { ...restR };
  let bodyTilt = 0;
  let bobY = 0;
  let bodyZ = 0;
  let bodyRot = 0;

  switch (f.state) {
    case 'idle': {
      // Bigger bounce — visible action even between punches
      bobY = Math.sin(phase * 1.4) * 0.09;
      bodyTilt = Math.sin(phase * 0.7) * 0.06;
      // Guard up, gloves near chin
      targetArmL = { rx: 0.9, rz: 0.7 };
      targetArmR = { rx: 0.9, rz: -0.7 };
      break;
    }
    case 'jab': {
      const dur = 0.28;
      const t0 = f.stateTimer / dur;
      const e = t0 < 0.35 ? t0 / 0.35 : 1 - (t0 - 0.35) / 0.65;
      const extend = Math.max(0, Math.min(1, e));
      // Left arm swings forward AND inward (rz>0 swings across body to +x) so
      // the glove crosses centerline and lands on the opponent's head
      targetArmL = { rx: -1.65 + (1 - extend) * 1.3, rz: 0.45 * extend };
      targetArmR = { rx: 0.8, rz: -0.7 };
      bodyZ = -extend * 0.7; // bigger step-in
      bodyRot = -extend * 0.12;
      if (f.stateTimer > dur + 0.05) setFighterState(f, 'idle');
      break;
    }
    case 'cross': {
      const dur = 0.32;
      const t0 = f.stateTimer / dur;
      const e = t0 < 0.4 ? t0 / 0.4 : 1 - (t0 - 0.4) / 0.6;
      const extend = Math.max(0, Math.min(1, e));
      // Right arm: rotation.x past -π/2 sends glove slightly upward, and
      // rotation.z negative swings it inward across the body to opponent's face
      targetArmR = { rx: -1.85 + (1 - extend) * 1.4, rz: -0.5 * extend };
      targetArmL = { rx: 0.7, rz: 0.55 };
      bodyZ = -extend * 0.9; // big lean — fighter steps into the punch
      bodyRot = extend * 0.4;
      if (f.stateTimer > dur + 0.05) setFighterState(f, 'idle');
      break;
    }
    case 'hook': {
      const dur = 0.38;
      const t0 = f.stateTimer / dur;
      const e = t0 < 0.4 ? t0 / 0.4 : 1 - (t0 - 0.4) / 0.6;
      const extend = Math.max(0, Math.min(1, e));
      // Wide looping hook — arm sweeps horizontally
      targetArmR = { rx: -0.5 - extend * 0.4, rz: -1.6 - extend * 0.4 };
      targetArmL = { rx: 0.9, rz: 0.6 };
      bodyRot = extend * 0.65;
      bodyZ = -extend * 0.55;
      if (f.stateTimer > dur + 0.08) setFighterState(f, 'idle');
      break;
    }
    case 'uppercut': {
      const dur = 0.4;
      const t0 = f.stateTimer / dur;
      const e = t0 < 0.4 ? t0 / 0.4 : 1 - (t0 - 0.4) / 0.6;
      const extend = Math.max(0, Math.min(1, e));
      // From low crouched to high upward; rz brings the fist inward at impact
      targetArmR = { rx: 0.4 - extend * 2.8, rz: -0.4 * extend };
      targetArmL = { rx: 0.9, rz: 0.5 };
      bodyZ = -extend * 0.75;
      bobY = -0.22 + extend * 0.42; // crouch then explode up
      if (f.stateTimer > dur + 0.08) setFighterState(f, 'idle');
      break;
    }
    case 'block': {
      targetArmL = { rx: -0.3, rz: 0.3 };
      targetArmR = { rx: -0.3, rz: -0.3 };
      bodyZ = 0.12;
      if (f.stateTimer > 0.4) setFighterState(f, 'idle');
      break;
    }
    case 'flinch': {
      // Sharp head-snap reaction from a landed hit. The defender's HEAD
      // rotates to the side as if recoiling from the glove, the body tilts
      // back and shifts away from the puncher, then everything snaps back.
      const dur = 0.32;
      const k = Math.min(1, f.stateTimer / dur);
      const wave = Math.sin(k * Math.PI);
      const dir = f.flinchDir ?? 1;
      // Head snap (around its own local y axis = vertical, so face turns aside)
      f.headGroup.rotation.y = wave * 0.55 * dir;
      f.headGroup.rotation.z = wave * 0.25 * dir;
      bodyTilt = -0.32 * wave;
      bodyZ = 0.28 * wave;  // body recoils backward (away from opponent)
      bodyRot = 0.15 * wave * dir;
      // Guard up (arms react to protect face)
      targetArmL = { rx: 0.4 - wave * 0.7, rz: 0.7 + wave * 0.5 };
      targetArmR = { rx: 0.4 - wave * 0.7, rz: -0.7 - wave * 0.5 };
      if (f.stateTimer > dur + 0.05) {
        f.headGroup.rotation.y = 0;
        f.headGroup.rotation.z = 0;
        setFighterState(f, 'idle');
      }
      break;
    }
    case 'stagger': {
      const k = Math.min(1, f.stateTimer / 0.6);
      bodyTilt = -0.5 * (1 - Math.abs(k - 0.5) * 2);
      bodyZ = 0.45 * k;
      bobY = Math.sin(f.stateTimer * 8) * 0.06;
      targetArmL = { rx: 0.4, rz: 1.0 };
      targetArmR = { rx: 0.4, rz: -1.0 };
      if (f.stateTimer > 0.8) setFighterState(f, 'idle');
      break;
    }
    case 'ko': {
      // Slower, clearer fall — 1.4s arc instead of 1s, with eased-out timing so
      // the topple has weight at the end. Smaller backward slide so the body
      // stays on-camera (the old 1.1-unit slide pushed the fighter off the
      // left/right edge on desktop FOV).
      const dur = 1.4;
      const raw = Math.min(1, f.stateTimer / dur);
      const k = 1 - Math.pow(1 - raw, 3); // ease-out cubic
      const targetTilt = Math.PI / 2 * f.side;
      g.rotation.z = targetTilt * k;
      g.position.x = f.side * 0.75 + f.side * k * 0.35;
      // Tiny rise so the rotated body silhouette sits ON the canvas instead of
      // sinking into it
      g.position.y = k * 0.15;
      // Arms splay outward as they fall
      targetArmL = { rx: 0.1, rz: 1.4 };
      targetArmR = { rx: 0.1, rz: -1.4 };
      // Small "bounce" right at impact — body hits canvas at k≈0.85
      const bounceK = Math.max(0, 1 - Math.abs(raw - 0.85) * 8);
      g.position.y += bounceK * 0.12;
      // Lingering twitch on the floor once they're down
      const twitch = f.stateTimer > dur ? Math.sin(f.stateTimer * 12) * 0.04 : 0;
      g.rotation.x = twitch;
      break;
    }
    case 'victory': {
      // Arms up celebrating
      targetArmL = { rx: -2.2, rz: 0.5 };
      targetArmR = { rx: -2.2, rz: -0.5 };
      bobY = Math.abs(Math.sin(phase * 1.5)) * 0.18;
      break;
    }
  }

  // Apply arm rotations (smooth lerp)
  // Slower lerp so punch swings are visible across multiple frames (previously
  // 0.45/frame → arm snapped to target in ~5 frames before the punch even
  // finished, which read as "the arm isn't really moving").
  const armLerp = 0.22;
  f.armL.rotation.x = THREE.MathUtils.lerp(f.armL.rotation.x, targetArmL.rx, armLerp);
  f.armL.rotation.z = THREE.MathUtils.lerp(f.armL.rotation.z, targetArmL.rz, armLerp);
  f.armR.rotation.x = THREE.MathUtils.lerp(f.armR.rotation.x, targetArmR.rx, armLerp);
  f.armR.rotation.z = THREE.MathUtils.lerp(f.armR.rotation.z, targetArmR.rz, armLerp);

  // Label position lerp: 'side' (off-screen-side) → 'top' (above head, pushed outward)
  const targetLerp = f.labelMode === 'top' ? 1 : 0;
  f.labelLerp = THREE.MathUtils.lerp(f.labelLerp, targetLerp, 0.12);
  if (f.label) {
    // Side pos: (0, 2.4, -3.2) — local -z is behind fighter = the screen-side
    // Top pos:  (0, 3.55, -2.0) — above head BUT also pushed -z (= further out
    //   toward the fighter's own side of the screen) so the two banners don't
    //   stack on top of each other near the ring center
    f.label.position.x = 0;
    f.label.position.y = THREE.MathUtils.lerp(2.4, 3.55, f.labelLerp);
    f.label.position.z = THREE.MathUtils.lerp(-3.2, -2.0, f.labelLerp);
    // Hide the banner during KO — after the fighter is rotated flat on the
    // canvas the local 'above head' position ends up on the floor, which looks
    // wrong. The big K.O. overlay does the labeling anyway.
    const targetOpacity = f.state === 'ko' ? 0 : 1;
    f.label.material.opacity = THREE.MathUtils.lerp(f.label.material.opacity, targetOpacity, 0.18);
  }

  // Body bob (only when not in KO state)
  // bodyZ is the fighter's local-forward lean (negative = leaning toward opponent).
  // In world space, that corresponds to motion along the x-axis (the fighters face each other on x).
  // Left fighter (side=-1) faces +x; right fighter (side=+1) faces -x. facing = -f.side.
  if (f.state !== 'ko') {
    const facing = -f.side;
    g.position.y = bobY;
    g.position.x = f.side * 0.75 + (-bodyZ) * facing;
    g.position.z = 0;
    g.rotation.x = 0;
    f.torso.rotation.z = bodyTilt;
    f.torso.rotation.y = bodyRot;
    f.headGroup.rotation.z = bodyTilt * 0.5;
  }

  f.stateTimer += dt;
}

/* ----- Audio (synthesized) ----- */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playBell() {
  ensureAudio();
  triggerBellSwing(1.0);
  const t = audioCtx.currentTime;
  // Multiple sine partials for a bell-like timbre
  const partials = [
    { f: 520, a: 0.4, d: 1.8 },
    { f: 780, a: 0.25, d: 1.4 },
    { f: 1100, a: 0.18, d: 1.1 },
    { f: 1640, a: 0.12, d: 0.7 },
  ];
  partials.forEach(p => {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = p.f;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(p.a, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + p.d);
    o.connect(g).connect(audioCtx.destination);
    o.start(t);
    o.stop(t + p.d);
  });
}
function playPunch(power = 1) {
  ensureAudio();
  const t = audioCtx.currentTime;
  // Low thud
  const o = audioCtx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(180 * power, t);
  o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.3 * power, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.2);

  // Noise crack
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const n = audioCtx.createBufferSource();
  n.buffer = buf;
  const ng = audioCtx.createGain();
  ng.gain.value = 0.18 * power;
  n.connect(ng).connect(audioCtx.destination);
  n.start(t);
}
function playCrowd() {
  ensureAudio();
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 1.4, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    const env = Math.min(1, i / 6000) * Math.min(1, (data.length - i) / 6000);
    data[i] = (Math.random() * 2 - 1) * env * 0.25;
  }
  const n = audioCtx.createBufferSource();
  n.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.value = 0.45;
  // band-pass to roar
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 600;
  bp.Q.value = 0.7;
  n.connect(bp).connect(g).connect(audioCtx.destination);
  n.start(t);
}

/* ----- Bout Choreography ----- */
function planBout(b1, b2) {
  const key = mkKey(b1, b2);
  const match = MATCHUPS[key];
  if (!match) {
    return {
      winner: b1, loser: b2,
      move: 'an inconclusive shrug',
      quip: 'A schism was declared. Both fighters went home to write differently-worded essays about it.',
    };
  }
  const winner = match.winner;
  const loser = (winner === b1) ? b2 : b1;
  return { winner, loser, move: match.move, quip: match.quip };
}

function generateEvents(durationS, winnerIsRight) {
  // Tighter, punchier sequence — frequent attacks, almost all land for max action.
  const events = [];
  let t = 0.6;
  const moves = ['jab', 'cross', 'hook', 'uppercut'];
  while (t < durationS - 2.6) {
    // Winner aggressive ~70% of the time
    const winnerAttacks = Math.random() < 0.7;
    const attacker = winnerAttacks ? 'winner' : 'loser';
    const defender = winnerAttacks ? 'loser' : 'winner';
    const move = moves[Math.floor(Math.random() * moves.length)];
    // Most punches connect for visible action
    const lands = winnerAttacks ? Math.random() < 0.85 : Math.random() < 0.55;
    events.push({ t, type: 'attack', attacker, defender, move, lands });
    t += 0.42 + Math.random() * 0.35; // 0.42s–0.77s between strikes
  }
  // Finisher sequence
  events.push({ t: durationS - 2.4, type: 'attack', attacker: 'winner', defender: 'loser', move: 'cross', lands: true, big: true });
  events.push({ t: durationS - 1.9, type: 'stagger', who: 'loser' });
  events.push({ t: durationS - 1.2, type: 'attack', attacker: 'winner', defender: 'loser', move: 'uppercut', lands: true, finisher: true });
  events.push({ t: durationS - 0.85, type: 'ko', who: 'loser' });
  events.push({ t: durationS - 0.2, type: 'victory', who: 'winner' });
  return events;
}

function clearFighters() {
  fighters.forEach(f => scene.remove(f.group));
  fighters = [];
}

function startBout(b1, b2) {
  clearFighters();
  // Hide notecard / replay
  document.getElementById('notecard-wrap').classList.remove('show');
  document.getElementById('replay').classList.remove('show');
  document.getElementById('fighter-tags').classList.add('show');
  document.getElementById('timer').classList.add('show');

  // Spawn fighters
  const f1 = buildFighter(b1, -1); // left/blue
  const f2 = buildFighter(b2, 1);  // right/red
  // Bell has rung → name banners move from screen sides to above each fighter's head
  f1.labelMode = 'top';
  f2.labelMode = 'top';
  scene.add(f1.group);
  scene.add(f2.group);
  fighters = [f1, f2];

  // Fade the top HUD so it doesn't compete with the action / banners
  document.body.classList.add('bout-active');

  // Tag display
  document.getElementById('tag1').textContent = b1.toUpperCase();
  document.getElementById('tag2').textContent = b2.toUpperCase();

  // Move ring girl off-stage
  ringGirl.group.visible = false;
  ringGirl.group.position.set(0, 0, 7);
  ringGirl.armL.rotation.set(0, 0, 0);
  ringGirl.armR.rotation.set(0, 0, 0);
  ringGirl.card.position.set(0.4, 1.5, 0);

  // Plan bout
  const plan = planBout(b1, b2);
  const winnerIsB1 = plan.winner === b1;
  const winnerFighter = winnerIsB1 ? f1 : f2;
  const loserFighter = winnerIsB1 ? f2 : f1;

  const duration = 13 + Math.random() * 2; // ~13–15s of action — short and punchy
  const events = generateEvents(duration, !winnerIsB1);

  bout = {
    startTime: clock.getElapsedTime(),
    duration,
    winner: winnerFighter,
    loser: loserFighter,
    winnerName: plan.winner,
    loserName: plan.loser,
    move: plan.move,
    quip: plan.quip,
    events,
    eventIdx: 0,
    state: 'fighting',
    finalShown: false,
  };

  // Round 1 banner
  const ri = document.getElementById('round-info');
  ri.textContent = 'ROUND 1';
  ri.classList.remove('show');
  void ri.offsetWidth;
  ri.classList.add('show');

  // Bell + crowd
  playBell();
  setTimeout(playBell, 280);
  setTimeout(playCrowd, 350);

  // Disable button until bout finishes
  document.getElementById('ringbell').disabled = true;
  document.getElementById('ringbell').textContent = 'FIGHTING…';
}

function endBout() {
  if (!bout) return;
  bout.state = 'verdict';
  document.getElementById('timer').classList.remove('show');
  // Bring the HUD back so the user can pick a different matchup
  document.body.classList.remove('bout-active');

  // Final bell
  playBell();
  setTimeout(playBell, 220);

  // Show ring girl walking in
  ringGirl.group.visible = true;
  ringGirl.group.position.set(0, 0, 7);
  ringGirl.entryStart = clock.getElapsedTime();

  // Populate notecard
  const winnerName = bout.winnerName;
  const loserName = bout.loserName;
  const move = bout.move;
  const quip = bout.quip;
  document.getElementById('nc-winner').textContent =
    `${winnerName.toUpperCase()} defeats ${loserName.toUpperCase()}`;
  document.getElementById('nc-move').textContent =
    `Winning move: ${move}.`;
  document.getElementById('nc-quip').textContent = `“${quip}”`;

  // Reveal card after the ring girl finishes walking + raising
  setTimeout(() => {
    document.getElementById('notecard-wrap').classList.add('show');
    document.getElementById('replay').classList.add('show');
    document.getElementById('ringbell').disabled = false;
    document.getElementById('ringbell').textContent = 'RING THE BELL';
  }, 3400);
}

/* ----- Per-frame update ----- */
function updateBout(t, dt) {
  if (!bout) return;
  const elapsed = t - bout.startTime;

  // Update timer display
  const remaining = Math.max(0, Math.ceil(bout.duration - elapsed));
  document.getElementById('timer').textContent = remaining;

  // Process scheduled events
  while (bout.eventIdx < bout.events.length && bout.events[bout.eventIdx].t <= elapsed) {
    const ev = bout.events[bout.eventIdx];
    handleEvent(ev);
    bout.eventIdx++;
  }

  // End-of-bout transition
  if (bout.state === 'fighting' && elapsed >= bout.duration) {
    endBout();
  }

  // Animate ring girl entry + card raise
  if (bout.state === 'verdict' && ringGirl.entryStart != null) {
    const e = t - ringGirl.entryStart;
    // Walk from z=7 to z=2 over 2 seconds
    const walkT = Math.min(1, e / 2.0);
    const eased = walkT * walkT * (3 - 2 * walkT);
    ringGirl.group.position.z = 7 - eased * 5; // ends at 2
    // bob legs slightly
    ringGirl.group.position.y = Math.abs(Math.sin(e * 7)) * 0.06 * (1 - walkT);
    // After walk, raise card
    if (e > 1.9) {
      const rT = Math.min(1, (e - 1.9) / 1.0);
      const re = rT * rT * (3 - 2 * rT);
      // Right arm rotates up, card follows
      ringGirl.armR.rotation.x = -re * 2.6;
      ringGirl.card.position.set(0.1, 1.5 + re * 1.4, -0.2 + re * 0.3);
      ringGirl.card.rotation.z = re * 0.1;
    }
  }
}

// Screen-shake state
let screenShake = 0;
function shakeScreen(amount) { screenShake = Math.max(screenShake, amount); }

const IMPACT_WORDS = ['POW!', 'WHAM!', 'BOOM!', 'BAM!', 'SOCK!', 'THWACK!', 'KAPOW!'];
function handleEvent(ev) {
  if (!bout) return;
  const winner = bout.winner;
  const loser = bout.loser;

  if (ev.type === 'attack') {
    const att = ev.attacker === 'winner' ? winner : loser;
    const def = ev.defender === 'winner' ? winner : loser;
    setFighterState(att, ev.move);
    if (ev.lands) {
      // Match impact timing to the punch animation's peak-extension frame so
      // the glove is physically nearest the defender's head when we trigger
      // the hit reaction. Different moves peak at slightly different times.
      const peakDelay = ev.move === 'jab' ? 100 : ev.move === 'cross' ? 130 : ev.move === 'hook' ? 160 : 170;
      setTimeout(() => {
        if (def.state === 'ko') return;
        // Direction the defender's head should snap: head pushed AWAY from
        // the side of attacker that struck. flinchDir = +1 turns head one
        // way, -1 the other.
        def.flinchDir = ev.move === 'jab' ? -att.side : att.side;
        setFighterState(def, 'flinch');
        // Spawn the impact sprite at the defender's head position (between
        // glove and head visually) so it lines up with the contact point.
        const impactX = def.group.position.x + (att.group.position.x - def.group.position.x) * 0.35;
        const impactY = 2.05 + (Math.random() - 0.5) * 0.15;
        const impactZ = (Math.random() - 0.5) * 0.25;
        const word = ev.finisher ? 'K.O.!' : (ev.big ? 'BOOM!' : IMPACT_WORDS[Math.floor(Math.random() * IMPACT_WORDS.length)]);
        spawnImpact({ x: impactX, y: impactY, z: impactZ }, word, ev.big || ev.finisher);
        playPunch(ev.big || ev.finisher ? 1.8 : 1.0);
        shakeScreen(ev.finisher ? 0.5 : ev.big ? 0.25 : 0.12);
        if (ev.finisher) showKOOverlay();
      }, peakDelay);
    }
  } else if (ev.type === 'stagger') {
    const who = ev.who === 'winner' ? winner : loser;
    setFighterState(who, 'stagger');
    setTimeout(playCrowd, 100);
  } else if (ev.type === 'ko') {
    const who = ev.who === 'winner' ? winner : loser;
    who.koZ = who.group.position.z;
    setFighterState(who, 'ko');
    playPunch(2.2);
    shakeScreen(0.6);
    spawnImpact({ x: who.group.position.x, y: 1.6, z: 0 }, 'K.O.!', true);
    setTimeout(playCrowd, 80);
  } else if (ev.type === 'victory') {
    const who = ev.who === 'winner' ? winner : loser;
    setFighterState(who, 'victory');
  }
}

function showKOOverlay() {
  const ri = document.getElementById('round-info');
  ri.textContent = 'K.O.!';
  ri.classList.remove('show');
  void ri.offsetWidth;
  ri.classList.add('show');
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(0.05, clock.getDelta());

  // Update audience sway
  audience.children.forEach(c => {
    c.position.y = c.userData.baseY + Math.sin(t * 2.5 + c.userData.basePhase) * 0.04;
  });

  // Impact-sprite lifecycle: scale up then fade out
  for (let i = impactPool.length - 1; i >= 0; i--) {
    const sp = impactPool[i];
    sp.userData.life += dt;
    const u = sp.userData.life / sp.userData.maxLife;
    if (u >= 1) {
      scene.remove(sp);
      sp.material.map?.dispose();
      sp.material.dispose();
      impactPool.splice(i, 1);
      continue;
    }
    // Quick scale-up burst, then linear fade
    const base = sp.userData.baseScale;
    const s = base * (u < 0.2 ? (0.4 + u * 3) : 1 + (u - 0.2) * 0.4);
    sp.scale.set(s, s, 1);
    sp.material.opacity = u < 0.5 ? 1 : 1 - (u - 0.5) * 2;
    // Slight upward drift
    sp.position.y += dt * 0.6;
    // Random wobble
    sp.material.rotation = Math.sin(sp.userData.life * 20) * 0.15;
  }

  // Screen shake — quick decay; applied to camera xy
  if (screenShake > 0.001) {
    screenShake *= Math.pow(0.0001, dt);
  } else {
    screenShake = 0;
  }

  // Brass bell swing — damped oscillation; clapper lags for clang feel
  if (bellSwingEnergy > 0.005) {
    bellSwingTime += dt;
    bellSwingEnergy *= Math.pow(0.35, dt); // decay
    const swing = Math.sin(bellSwingTime * 16) * bellSwingEnergy * 0.55;
    brassBell.pivot.rotation.z = swing;
    // Clapper offset (phase-lagged) — gives the impression of an inner clapper striking the walls
    brassBell.clapperBall.position.x = Math.sin(bellSwingTime * 16 + 1.1) * bellSwingEnergy * 0.18;
  } else {
    brassBell.pivot.rotation.z *= 0.9;
    brassBell.clapperBall.position.x *= 0.9;
  }

  // Update fighters
  fighters.forEach(f => updateFighter(f, t, dt));

  // Update bout
  if (bout) updateBout(t, dt);

  // Subtle camera sway + impact-driven shake
  const shakeX = (Math.random() - 0.5) * screenShake;
  const shakeY = (Math.random() - 0.5) * screenShake;
  camera.position.x = Math.sin(t * 0.1) * 0.3 + shakeX;
  camera.position.y = 5.6 + shakeY;
  camera.lookAt(0, 1.5, 0);

  renderer.render(scene, camera);
}

/* ============================================================
   UI WIRING
   ============================================================ */
function buildDropdown(wrapId, initial) {
  const wrap = document.getElementById(wrapId);
  const trigger = wrap.querySelector('.dropdown-trigger');
  const valueEl = wrap.querySelector('.dropdown-value');
  const list = wrap.querySelector('.dropdown-list');
  wrap.dataset.value = initial;
  valueEl.textContent = initial;

  BELIEFS.forEach(b => {
    const li = document.createElement('li');
    li.textContent = b;
    li.dataset.value = b;
    if (b === initial) li.classList.add('selected');
    li.addEventListener('click', (e) => {
      e.stopPropagation();
      wrap.dataset.value = b;
      valueEl.textContent = b;
      list.querySelectorAll('li').forEach(x => x.classList.remove('selected'));
      li.classList.add('selected');
      wrap.classList.remove('open');
    });
    list.appendChild(li);
  });

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.dropdown.open').forEach(d => {
      if (d !== wrap) d.classList.remove('open');
    });
    wrap.classList.toggle('open');
  });
}

buildDropdown('fighter1-dropdown', 'Catholicism');
buildDropdown('fighter2-dropdown', 'Science');

// Close dropdowns when clicking outside
document.addEventListener('click', () => {
  document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
});
// Also close on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
  }
});

function getPickedBeliefs() {
  return [
    document.getElementById('fighter1-dropdown').dataset.value,
    document.getElementById('fighter2-dropdown').dataset.value,
  ];
}

document.getElementById('ringbell').addEventListener('click', () => {
  ensureAudio();
  let [b1, b2] = getPickedBeliefs();
  if (b1 === b2) {
    // Same-vs-same: pick a random different one for B2
    const others = BELIEFS.filter(x => x !== b1);
    b2 = others[Math.floor(Math.random() * others.length)];
    // Reflect in the UI
    const wrap = document.getElementById('fighter2-dropdown');
    wrap.dataset.value = b2;
    wrap.querySelector('.dropdown-value').textContent = b2;
    wrap.querySelectorAll('.dropdown-list li').forEach(li => {
      li.classList.toggle('selected', li.dataset.value === b2);
    });
  }
  startBout(b1, b2);
});

document.getElementById('replay').addEventListener('click', () => {
  document.getElementById('notecard-wrap').classList.remove('show');
  document.getElementById('replay').classList.remove('show');
  const [b1, b2] = getPickedBeliefs();
  startBout(b1, b2);
});

/* ============================================================
   SOCIAL SHARING
   Generates a 1080x1080 composite image (canvas screenshot + verdict
   panel + branding) and shares it via:
     - Web Share API with file (mobile — routes to Instagram, etc.)
     - Twitter/X intent URL (desktop fallback)
     - Facebook sharer URL (desktop fallback)
     - Download (Instagram fallback + Save Image button)
   ============================================================ */
const SITE_URL = 'https://battle-of-beliefs.vercel.app';

function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 5) {
  const words = text.split(' ');
  let line = '';
  const lines = [];
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  const shown = lines.slice(0, maxLines);
  if (lines.length > maxLines) shown[maxLines - 1] = shown[maxLines - 1].replace(/\s*\S+$/, '…');
  shown.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
  return shown.length * lineHeight;
}

function generateShareImage() {
  // Force a fresh render so the canvas pixel buffer is up to date
  renderer.render(scene, camera);

  const W = 1080, H = 1080;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');

  // Background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1a0a08');
  bg.addColorStop(1, '#050505');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Top red banner
  ctx.fillStyle = '#c8102e';
  ctx.fillRect(0, 0, W, 140);
  ctx.fillStyle = '#d6a737';
  ctx.fillRect(0, 132, W, 8);
  ctx.fillStyle = '#fff5c8';
  ctx.font = 'bold 78px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('BATTLE OF BELIEFS', W / 2, 64);
  ctx.fillStyle = '#fff8d8';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillText('· THE THEOLOGICAL THROWDOWN ·', W / 2, 108);

  // Scene screenshot (crop center area of canvas) inside a framed region
  const src = renderer.domElement;
  const dstX = 30, dstY = 160, dstW = 1020, dstH = 540;
  // Compute source crop that matches dst aspect ratio (1020/540 ≈ 1.89)
  const srcAspect = src.width / src.height;
  const dstAspect = dstW / dstH;
  let sX = 0, sY = 0, sW = src.width, sH = src.height;
  if (srcAspect > dstAspect) {
    // source wider than dst — crop sides
    sW = src.height * dstAspect;
    sX = (src.width - sW) / 2;
  } else {
    // source taller — crop top/bottom
    sH = src.width / dstAspect;
    sY = (src.height - sH) / 2;
  }
  ctx.fillStyle = '#000';
  ctx.fillRect(dstX - 4, dstY - 4, dstW + 8, dstH + 8);
  try {
    ctx.drawImage(src, sX, sY, sW, sH, dstX, dstY, dstW, dstH);
  } catch (e) {
    ctx.fillStyle = '#222';
    ctx.fillRect(dstX, dstY, dstW, dstH);
    ctx.fillStyle = '#666';
    ctx.font = '32px sans-serif';
    ctx.fillText('(screenshot unavailable)', W / 2, dstY + dstH / 2);
  }
  // Gold frame around screenshot
  ctx.strokeStyle = '#d6a737';
  ctx.lineWidth = 6;
  ctx.strokeRect(dstX, dstY, dstW, dstH);

  // Verdict card
  const cardX = 30, cardY = 730, cardW = 1020, cardH = 290;
  ctx.fillStyle = '#fff7df';
  ctx.fillRect(cardX, cardY, cardW, cardH);
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 6;
  ctx.strokeRect(cardX, cardY, cardW, cardH);
  // Small red "VERDICT" tag
  ctx.fillStyle = '#c8102e';
  ctx.fillRect(cardX + 32, cardY + 22, 160, 36);
  ctx.fillStyle = '#fff7df';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('VERDICT', cardX + 50, cardY + 47);

  // Winner line
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 44px sans-serif';
  ctx.textAlign = 'center';
  const w = bout?.winnerName ?? '—';
  const l = bout?.loserName ?? '—';
  ctx.fillText(`${w.toUpperCase()} defeats ${l.toUpperCase()}`, W / 2, cardY + 100);

  // Move line
  ctx.fillStyle = '#8a3a13';
  ctx.font = 'italic 26px serif';
  ctx.fillText(`Winning move: ${bout?.move ?? '—'}.`, W / 2, cardY + 146);

  // Quip (wraps)
  ctx.fillStyle = '#1a1a1a';
  ctx.font = '28px "Times New Roman", serif';
  ctx.textAlign = 'center';
  wrapText(ctx, `"${bout?.quip ?? ''}"`, W / 2, cardY + 196, cardW - 80, 36, 3);

  // Footer URL strip
  ctx.fillStyle = '#d6a737';
  ctx.fillRect(0, H - 50, W, 50);
  ctx.fillStyle = '#1a0a02';
  ctx.font = 'bold 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('battle-of-beliefs.vercel.app', W / 2, H - 25);

  return out;
}

function canvasToBlob(canvas, type = 'image/png') {
  return new Promise(resolve => canvas.toBlob(resolve, type, 0.92));
}
function downloadCanvas(canvas, name = 'battle-of-beliefs.png') {
  canvas.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  });
}

function shareText() {
  const w = bout?.winnerName ?? '';
  const l = bout?.loserName ?? '';
  const q = bout?.quip ?? '';
  return `${w} defeats ${l} — Battle of Beliefs.\n\n"${q}"\n`;
}

async function shareViaWebShare(filename = 'battle-of-beliefs.png') {
  if (!navigator.share) return false;
  try {
    const canvas = generateShareImage();
    const blob = await canvasToBlob(canvas);
    const file = new File([blob], filename, { type: 'image/png' });
    const shareData = { files: [file], text: shareText(), url: SITE_URL };
    if (navigator.canShare && navigator.canShare(shareData)) {
      await navigator.share(shareData);
      return true;
    }
    // Fallback: share text + URL only (no file)
    await navigator.share({ text: shareText(), url: SITE_URL });
    return true;
  } catch (e) {
    if (e.name === 'AbortError') return true; // user cancelled — treat as handled
    return false;
  }
}

document.getElementById('share-x').addEventListener('click', async () => {
  // Try Web Share API first on mobile (lets user pick X with the image attached)
  if (navigator.share && /Mobi|Android|iPhone|iPad/.test(navigator.userAgent)) {
    if (await shareViaWebShare()) return;
  }
  const text = encodeURIComponent(shareText());
  const url = encodeURIComponent(SITE_URL);
  window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank', 'noopener,noreferrer');
});

document.getElementById('share-fb').addEventListener('click', async () => {
  if (navigator.share && /Mobi|Android|iPhone|iPad/.test(navigator.userAgent)) {
    if (await shareViaWebShare()) return;
  }
  // Facebook sharer pulls og:image + title from the URL's meta tags
  const url = encodeURIComponent(SITE_URL);
  const quote = encodeURIComponent(shareText());
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}&quote=${quote}`, '_blank', 'noopener,noreferrer');
});

document.getElementById('share-ig').addEventListener('click', async () => {
  // Instagram has no web-share URL — try Web Share API first (lets the user pick
  // Instagram on mobile with the image attached), otherwise download the image.
  if (await shareViaWebShare()) return;
  const canvas = generateShareImage();
  downloadCanvas(canvas, 'battle-of-beliefs-instagram.png');
  alert("Saved! Instagram doesn't support direct web posting. Open Instagram and upload the saved image to share.");
});

document.getElementById('share-save').addEventListener('click', () => {
  const canvas = generateShareImage();
  downloadCanvas(canvas, `battle-of-beliefs-${(bout?.winnerName ?? 'verdict').toLowerCase().replace(/\W+/g, '-')}.png`);
});

// Close the Official Ruling card — also hides the rematch button so the user

  document.getElementById('notecard-wrap').classList.remove('show');

}
document.getElementById('nc-close').addEventListener('click', closeNotecard);
document.addEventListener('keydown', (e) => {

    closeNotecard();

});

showIdleDemo();
